name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'mike-north/sh-codemod' && github.actor == 'mike-north'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: env -u NO_COLOR nice pnpm install --frozen-lockfile
      - name: Keep changesets in the 0.x series
        run: env -u NO_COLOR nice pnpm check:changesets
      - name: Keep current and projected versions in the 0.x series
        if: ${{ !cancelled() }}
        run: env -u NO_COLOR nice pnpm check:versions
      - run: env -u NO_COLOR nice pnpm build
      - run: env -u NO_COLOR nice pnpm check
      - run: env -u NO_COLOR nice pnpm test
      - name: Check tracked generated artifacts
        run: git diff --exit-code
      - name: Check staged generated artifacts
        run: git diff --cached --exit-code
      - name: Plan only unpublished versions
        run: env -u NO_COLOR nice pnpm release:plan
      - name: Publish planned versions through native npm OIDC
        run: env -u NO_COLOR nice pnpm release:publish
