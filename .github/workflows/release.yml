# The file name and the `npm` environment are the identity registered with npm trusted
# publishing for this package; renaming either one stops publication.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mike-north/sh-codemod'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: env -u NO_COLOR nice pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version:packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
